spring.application.name=identity-stack
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identitystack}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ankit@123}

# Connection retry settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 10 min in milliseconds
jwt.token.duration=${TOKEN_EXPIRATION:600000}
jwt.token.issuer=${TOKEN_ISSUER:ankit12}

